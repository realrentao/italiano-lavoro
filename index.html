<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>意语职场通 · Italiano per il Lavoro</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --ink:#1f2733; --sub:#5b6675;
    --line:#e6e9ef; --accent:#2563eb; --accent2:#0ea5a4;
    --ok:#16a34a; --shadow:0 2px 10px rgba(20,30,50,.06);
    --chip:#eef2f8; --chipOn:#2563eb;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6; font-size:15px;
  }
  a{color:inherit;}
  .wrap{max-width:1040px;margin:0 auto;padding:0 14px 60px;}
  header.top{
    background:linear-gradient(120deg,#1e3a8a,#0ea5a4);
    color:#fff;padding:22px 14px 18px;position:sticky;top:0;z-index:30;
    box-shadow:0 2px 12px rgba(20,30,50,.18);
  }
  .top .wrap{padding-bottom:0;}
  .brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .brand h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.5px;}
  .brand .en{font-size:12px;opacity:.85;font-weight:500;}
  .topbar{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap;}
  .search{flex:1;min-width:200px;display:flex;background:#fff;border-radius:10px;overflow:hidden;}
  .search input{border:0;outline:0;flex:1;padding:10px 12px;font-size:15px;color:#1f2733;}
  .search button{border:0;background:#fff;color:var(--accent);padding:0 14px;font-size:15px;cursor:pointer;}
  .progmini{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);padding:6px 12px;border-radius:10px;font-size:13px;}
  .progmini .bar{width:90px;height:8px;background:rgba(255,255,255,.3);border-radius:6px;overflow:hidden;}
  .progmini .bar i{display:block;height:100%;background:#fde047;width:0;}

  .home-intro{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:16px 0;box-shadow:var(--shadow);font-size:14px;color:var(--sub);}
  .home-intro b{color:var(--ink);}

  .section-title{font-size:16px;font-weight:800;margin:20px 2px 10px;display:flex;align-items:center;gap:8px;}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px;}
  .chip{border:1px solid var(--line);background:var(--chip);color:var(--sub);padding:7px 13px;border-radius:20px;font-size:13px;cursor:pointer;user-select:none;transition:.15s;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:8px;}
  .icard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;box-shadow:var(--shadow);transition:.15s;position:relative;overflow:hidden;}
  .icard:hover{transform:translateY(-2px);border-color:var(--accent);}
  .icard .ic{font-size:30px;}
  .icard .nm{font-weight:800;margin-top:6px;font-size:15px;}
  .icard .it{font-size:12px;color:var(--sub);}
  .icard .meta{font-size:11px;color:var(--sub);margin-top:8px;}
  .icard .pbar{height:6px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden;}
  .icard .pbar i{display:block;height:100%;background:var(--ok);width:0;}

  .back{display:inline-flex;align-items:center;gap:6px;color:var(--accent);cursor:pointer;font-weight:700;margin:14px 2px 0;font-size:14px;}
  .ind-head{display:flex;align-items:center;gap:12px;margin:14px 0 4px;flex-wrap:wrap;}
  .ind-head .ic{font-size:34px;}
  .ind-head h2{margin:0;font-size:20px;}
  .ind-head .it{color:var(--sub);font-size:13px;}

  .tabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0 6px;border-bottom:1px solid var(--line);padding-bottom:0;}
  .tab{border:0;background:none;padding:10px 14px;font-size:14px;color:var(--sub);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;font-weight:700;}
  .tab.on{color:var(--accent);border-bottom-color:var(--accent);}

  .block{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 4px;margin-top:10px;box-shadow:var(--shadow);}
  .row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .row:last-child{border-bottom:0;}
  .row .main{flex:1;min-width:180px;}
  .row .it{font-weight:800;font-size:15.5px;}
  .row .rom{color:var(--accent2);font-size:13px;margin-top:1px;}
  .row .cn{color:var(--sub);font-size:13.5px;margin-top:1px;}
  .row.culture{display:block;}
  .row.culture .ct{font-size:14px;color:var(--ink);}
  .row.culture .ct b{color:var(--accent);}
  .au{border:1px solid var(--line);background:#f3f6fb;color:#1e3a8a;border-radius:8px;width:34px;height:34px;font-size:15px;cursor:pointer;flex:none;display:inline-flex;align-items:center;justify-content:center;}
  .au:active{transform:scale(.92);}
  .au.cn{color:#b91c1c;background:#fdf2f2;}
  .au.busy{opacity:.5;}
  .mark{border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:8px;padding:0 9px;height:34px;font-size:12px;cursor:pointer;flex:none;white-space:nowrap;}
  .mark.on{background:var(--ok);color:#fff;border-color:var(--ok);}
  .role{font-size:11px;color:#fff;background:var(--accent);padding:1px 8px;border-radius:10px;display:inline-block;margin-bottom:3px;}

  .res-group{margin-top:14px;}
  .res-group h3{font-size:14px;margin:6px 2px;color:var(--accent);}

  .note{font-size:12px;color:var(--sub);margin:14px 2px;line-height:1.7;}
  .empty{text-align:center;color:var(--sub);padding:40px 10px;}

  .dash{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:10px;}
  .dcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);}
  .dcard .nm{font-weight:800;}
  .dcard .dbar{height:9px;background:var(--line);border-radius:6px;margin:8px 0 4px;overflow:hidden;}
  .dcard .dbar i{display:block;height:100%;background:var(--ok);}
  .dcard .dt{font-size:12px;color:var(--sub);}

  footer{text-align:center;color:var(--sub);font-size:12px;margin-top:26px;line-height:1.8;}
  .reset{background:none;border:1px solid var(--line);color:var(--sub);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:12px;}
  @media(max-width:560px){
    .brand h1{font-size:17px;}
    .row .main{min-width:140px;}
    .grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));}
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <span style="font-size:26px">🇮🇹💼</span>
      <div>
        <h1>意语职场通</h1>
        <div class="en">Italiano per il Lavoro · 意大利各行业华人实用意大利语</div>
      </div>

    <div class="topbar">
      <div class="search">
        <input id="q" placeholder="搜索词汇 / 句型 / 对话…（中意均可）" onkeydown="if(event.key==='Enter')doSearch()">

      </div>
      <div class="progmini">
        <span id="pmTxt">0%</span>
        <span class="bar"><i id="pmBar"></i></span>

  </div>
</header>

<div class="wrap" id="app"></div>

/* ============ 发音：优先 edge-tts 真人 mp3，失败回退 Web Speech ============ */
let voices=[];
function loadVoices(){ try{voices=speechSynthesis.getVoices();}catch(e){} }
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=loadVoices; loadVoices(); }
function fallbackSpeak(text,lang){
  if(!('speechSynthesis' in window)){ alert('当前浏览器不支持语音播放，请用 Chrome / Edge 手机版'); return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=lang; u.rate=lang==='zh-CN'?1:0.9;
  const v=voices.find(x=>x.lang===lang)||voices.find(x=>x.lang&&x.lang.startsWith(lang.split('-')[0]));
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}
function speak(text,lang,audioPath,btn){
  if(audioPath){
    const a=new Audio(audioPath);
    let fell=false;
    const fb=()=>{ if(!fell){ fell=true; fallbackSpeak(text,lang); } };
    a.addEventListener('error',fb);
    const p=a.play();
    if(p&&p.catch) p.catch(fb);
    return;
  }
  fallbackSpeak(text,lang);
}

/* ============ 进度存储 ============ */
const KEY='lavoro_it_progress_v2';
let prog={};
try{ prog=JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){ prog={}; }
function saveProg(){ try{ localStorage.setItem(KEY,JSON.stringify(prog)); }catch(e){} }
function isDone(id){ return !!prog[id]; }
function totalCount(){
  let n=0;
  INDUSTRIES.forEach(I=>{
    n+=I.vocab.length; n+=I.sentences.length;
    I.dialogues.forEach(d=>n+=d.lines.length);
  });
  return n;
}
function doneCount(){
  let n=0;
  INDUSTRIES.forEach(I=>{
    I.vocab.forEach((_,i)=>{ if(isDone(I.id+'-v-'+i))n++; });
    I.sentences.forEach((_,i)=>{ if(isDone(I.id+'-s-'+i))n++; });
    I.dialogues.forEach((d,di)=>{ d.lines.forEach((_,li)=>{ if(isDone(I.id+'-d-'+di+'-'+li))n++; }); });
  });
  return n;
}
function indTotal(I){ return I.vocab.length+I.sentences.length+I.dialogues.reduce((a,d)=>a+d.lines.length,0); }
function indDone(I){
  let n=0;
  I.vocab.forEach((_,i)=>{ if(isDone(I.id+'-v-'+i))n++; });
  I.sentences.forEach((_,i)=>{ if(isDone(I.id+'-s-'+i))n++; });
  I.dialogues.forEach((d,di)=>{ d.lines.forEach((_,li)=>{ if(isDone(I.id+'-d-'+di+'-'+li))n++; }); });
  return n;
}

    <div class="note">
      提示：①「中文谐音」为近似发音，仅供辅助，准确发音请以 🔊 / 🀄 真人语音为准；②真人语音为站点自带 mp3，
      首次加载需联网下载，之后浏览器会缓存；离线或个别音频缺失时自动回退浏览器内置语音；③进度保存在当前浏览器本地，换设备不同步。
    </div>
    <div style="text-align:center;margin-top:10px;">
      <button class="reset" onclick="resetProg()">清空学习进度</button>
    </div>
    <footer>意语职场通 · Italiano per il Lavoro · 为意大利华人从业者而做 🇮🇹</footer>
  `;
  renderDash();
}
function renderDash(){
  const el=document.getElementById('dash'); if(!el)return;
  el.innerHTML=INDUSTRIES.map(I=>{
    const d=indDone(I),t=indTotal(I);
    return `<div class="dcard">
      <div class="nm">${I.icon} ${esc(I.name)}</div>
      <div class="dbar"><i style="width:${pct(d,t)}%"></i></div>
      <div class="dt">${pct(d,t)}% · 已学 ${d}/${t}</div>
    </div>`;
  }).join('');
}

function openInd(id){
  view.type='ind'; view.ind=id; view.tab='vocab';
  render();
}
function renderInd(){
  const I=INDUSTRIES.find(x=>x.id===view.ind);
  const d=indDone(I),t=indTotal(I);
  const tabs=[['vocab','词汇'],['dialog','对话'],['sent','句型'],['culture','文化']];
  let body='';
  if(view.tab==='vocab') body=I.vocab.map((_,i)=>vocabRow(I,i)).join('');
  else if(view.tab==='sent') body=I.sentences.map((_,i)=>sentRow(I,i)).join('');
  else if(view.tab==='dialog') body=dialogBlock(I);
  else body=cultureBlock(I);
  app.innerHTML=`
    <div class="back" onclick="goHome()">← 返回行业列表</div>
    <div class="ind-head">
      <div class="ic">${I.icon}</div>
      <div>
        <h2>${esc(I.name)}</h2>
        <div class="it">${esc(I.it)} · 已学 ${d}/${t}（${pct(d,t)}%）</div>
      </div>
    </div>
    <div class="tabs">
      ${tabs.map(t=>`<button class="tab ${view.tab===t[0]?'on':''}" onclick="setTab('${t[0]}')">${t[1]}</button>`).join('')}
    </div>
    <div class="block">${body||'<div class="empty">暂无内容</div>'}</div>
  `;
}
function setTab(t){ view.tab=t; renderInd(); }
function goHome(){ view.type='home'; render(); }

function doSearch(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  if(!q){ goHome(); return; }
  view.type='search'; view.q=q; renderSearch();
}
function renderSearch(){
  const q=view.q;
  let groups=[];
  INDUSTRIES.forEach(I=>{
    let vh=I.vocab.map((v,i)=>[v,i]).filter(([v])=>[v[0],v[1],v[2]].join(' ').toLowerCase().includes(q))
      .map(([v,i])=>vocabRow(I,i)).join('');
    let sh=I.sentences.map((s,i)=>[s,i]).filter(([s])=>[s[0],s[1],s[2]].join(' ').toLowerCase().includes(q))
      .map(([s,i])=>sentRow(I,i)).join('');
    let dh='';
    I.dialogues.forEach((d,di)=>{
      const lines=d.lines.filter(ln=>[ln[0],ln[1],ln[2]].join(' ').toLowerCase().includes(q));
      if(d.scene.toLowerCase().includes(q)||lines.length){
        lines.forEach((ln)=>{
          const idx=d.lines.indexOf(ln); const id=I.id+'-d-'+di+'-'+idx; const on=isDone(id);
          const ait=`audio/${I.id}/d_${di}_${idx}_it.mp3`, azh=`audio/${I.id}/d_${di}_${idx}_zh.mp3`;
          dh+=`<div class="row"><div class="main"><span class="role">${esc(ln[0])}</span>
            <div class="it">${esc(ln[1])}</div><div class="cn">${esc(ln[2])}</div></div>
            <button class="au" data-spk="${esc(ln[1])}" data-lang="it-IT" data-audio="${ait}">🔊</button>
            <button class="au cn" data-spk="${esc(ln[2])}" data-lang="zh-CN" data-audio="${azh}">🀄</button>
            <button class="mark ${on?'on':''}" data-id="${id}">${on?'✓ 已掌握':'标记掌握'}</button></div>`;
        });
      }
    });
    let ch=I.culture.filter(c=>c.toLowerCase().includes(q)).map(c=>`<div class="row culture"><div class="ct">• ${esc(c)}</div></div>`).join('');
    const total=vh+sh+dh+ch;
    if(total) groups.push(`<div class="res-group"><h3>${I.icon} ${esc(I.name)} · ${esc(I.it)}</h3><div class="block">${total}</div></div>`);
  });
  app.innerHTML=`
    <div class="back" onclick="goHome()">← 返回行业列表</div>
    <div class="section-title">🔍 搜索「${esc(view.q)}」的结果</div>
    ${groups.join('')||'<div class="empty">没有找到相关内容，换个词试试。</div>'}
  `;
}

function resetProg(){
  if(confirm('确定清空全部学习进度吗？此操作不可恢复。')){
    prog={}; saveProg(); render(); renderHeader();
  }
}

/* ============ 事件委托 ============ */
document.addEventListener('click',e=>{
  const au=e.target.closest('[data-spk]');
  if(au){ speak(au.dataset.spk, au.dataset.lang, au.dataset.audio, au); return; }
  const mk=e.target.closest('.mark');
  if(mk){
    const id=mk.dataset.id;
    if(isDone(id)) delete prog[id]; else prog[id]=1;
    saveProg(); renderHeader();
    const on=isDone(id);
    mk.classList.toggle('on',on);
    if(mk.textContent!=='✓') mk.textContent=on?'✓ 已掌握':'标记掌握';
    if(view.type==='home') renderDash();
    if(view.type==='ind'){
      const I=INDUSTRIES.find(x=>x.id===view.ind); const d=indDone(I),t=indTotal(I);
      document.querySelector('.ind-head .it').textContent=`${I.it} · 已学 ${d}/${t}（${pct(d,t)}%）`;
    }
    return;
  }
});

function render(){ renderHeader(); if(view.type==='home')renderHome(); else if(view.type==='ind')renderInd(); else renderSearch(); }
render();
</script>
</body>
</html>
