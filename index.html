<script>window.META = [{"id":"parrucchiere","name":"美发","it":"Parrucchiere / Estetica","icon":"💇","color":"#db2777","vn":360,"sn":253,"dn":165,"cn":63,"ds":19},{"id":"unghie","name":"美甲","it":"Nail art / Manicure","icon":"💅","color":"#db2777","vn":70,"sn":39,"dn":38,"cn":13,"ds":5},{"id":"makeup","name":"美妆","it":"Trucco / Make-up","icon":"💄","color":"#c026d3","vn":69,"sn":37,"dn":34,"cn":13,"ds":5},{"id":"ristorazione","name":"餐饮","it":"Ristorazione","icon":"🍝","color":"#dc2626","vn":101,"sn":60,"dn":39,"cn":19,"ds":7},{"id":"commercio","name":"批发零售","it":"Commercio","icon":"🛒","color":"#0891b2","vn":69,"sn":47,"dn":31,"cn":19,"ds":5},{"id":"lavanderia","name":"干洗店","it":"Lavanderia / Lavasecco","icon":"🧺","color":"#2563eb","vn":78,"sn":48,"dn":25,"cn":18,"ds":5},{"id":"tessile","name":"纺织","it":"Tessile / Abbigliamento","icon":"🧵","color":"#7c3aed","vn":81,"sn":46,"dn":32,"cn":18,"ds":5},{"id":"edilizia","name":"建筑","it":"Edilizia","icon":"🏗️","color":"#ea580c","vn":83,"sn":48,"dn":32,"cn":19,"ds":6},{"id":"magazzino","name":"物流仓储","it":"Magazzino / Logistica","icon":"📦","color":"#4d7c0f","vn":67,"sn":48,"dn":31,"cn":18,"ds":5},{"id":"pulizie","name":"家政清洁","it":"Pulizie / Colf","icon":"🧹","color":"#0d9488","vn":74,"sn":49,"dn":30,"cn":19,"ds":5},{"id":"fabbrica","name":"工厂制造","it":"Fabbrica / Produzione","icon":"🏭","color":"#475569","vn":79,"sn":49,"dn":31,"cn":18,"ds":5},{"id":"rider","name":"外卖快递","it":"Consegna / Rider","icon":"🛵","color":"#d97706","vn":72,"sn":46,"dn":30,"cn":18,"ds":5}];</script>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --ink:#1f2733; --sub:#5b6675;
    --line:#e6e9ef; --accent:#2563eb; --accent2:#0ea5a4;
    --ok:#16a34a; --shadow:0 2px 10px rgba(20,30,50,.06);
    --chip:#eef2f8; --chipOn:#2563eb;
    --fs:1; /* 内容字号缩放系数，由字号按钮控制 */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.6; font-size:15px;
  }
  a{color:inherit;}
  .wrap{max-width:1040px;margin:0 auto;padding:0 14px 60px;}
  header.top{
    background:linear-gradient(120deg,#1e3a8a,#0ea5a4);
    color:#fff;padding:22px 14px 18px;position:sticky;top:0;z-index:30;
    box-shadow:0 2px 12px rgba(20,30,50,.18);
  }
  .top .wrap{padding-bottom:0;}
  .brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .brand h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.5px;}
  .brand .en{font-size:12px;opacity:.85;font-weight:500;}
  .topbar{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap;}
  .search{flex:1;min-width:200px;display:flex;background:#fff;border-radius:10px;overflow:hidden;}
  .search input{border:0;outline:0;flex:1;padding:10px 12px;font-size:15px;color:#1f2733;}
  .search button{border:0;background:#fff;color:var(--accent);padding:0 14px;font-size:15px;cursor:pointer;}
  .progmini{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);padding:6px 12px;border-radius:10px;font-size:13px;}
  .progmini .bar{width:90px;height:8px;background:rgba(255,255,255,.3);border-radius:6px;overflow:hidden;}
  .progmini .bar i{display:block;height:100%;background:#fde047;width:0;}

  .fsctl{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);padding:5px 10px;border-radius:10px;font-size:13px;color:#fff;}
  .fsctl .lbl{opacity:.85;}
  .fsctl .fsbtn{border:0;background:rgba(255,255,255,.25);color:#fff;min-width:30px;height:30px;border-radius:8px;font-size:15px;font-weight:800;cursor:pointer;padding:0 8px;}
  .fsctl .fsbtn:active{background:rgba(255,255,255,.42);}
  .fsctl .fsval{min-width:26px;text-align:center;font-weight:700;font-size:13px;}

  .home-intro{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:16px 0;box-shadow:var(--shadow);font-size:14px;color:var(--sub);}
  .home-intro b{color:var(--ink);}

  .section-title{font-size:16px;font-weight:800;margin:20px 2px 10px;display:flex;align-items:center;gap:8px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:8px;}
  .icard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;box-shadow:var(--shadow);transition:.15s;position:relative;overflow:hidden;}
  .icard:hover{transform:translateY(-2px);border-color:var(--accent);}
  .icard .ic{font-size:30px;}
  .icard .nm{font-weight:800;margin-top:6px;font-size:15px;}
  .icard .it{font-size:12px;color:var(--sub);}
  .icard .meta{font-size:11px;color:var(--sub);margin-top:8px;}
  .icard .pbar{height:6px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden;}
  .icard .pbar i{display:block;height:100%;background:var(--ok);width:0;}

  .back{display:inline-flex;align-items:center;gap:6px;color:var(--accent);cursor:pointer;font-weight:700;margin:14px 2px 0;font-size:14px;}
  .ind-head{display:flex;align-items:center;gap:12px;margin:14px 0 4px;flex-wrap:wrap;}
  .ind-head .ic{font-size:34px;}
  .ind-head h2{margin:0;font-size:20px;}
  .ind-head .it{color:var(--sub);font-size:13px;}

  .tabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0 6px;border-bottom:1px solid var(--line);padding-bottom:0;}
  .tab{border:0;background:none;padding:10px 14px;font-size:14px;color:var(--sub);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;font-weight:700;}
  .tab.on{color:var(--accent);border-bottom-color:var(--accent);}

  .block{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 4px;margin-top:10px;box-shadow:var(--shadow);}
  .grp{background:#eef2f8;color:#1e3a8a;font-weight:800;font-size:13px;padding:8px 12px;border-bottom:1px solid var(--line);border-top:1px solid var(--line);letter-spacing:.3px;}
  .grp:first-child{border-top:0;}
  .row{display:block;padding:11px 12px;border-bottom:1px solid var(--line);content-visibility:auto;contain-intrinsic-size:auto 92px;}
  .row:last-child{border-bottom:0;}
  .rowtop{display:flex;justify-content:flex-end;margin-bottom:3px;}
  .rowtop .mark{height:26px;font-size:11px;padding:0 10px;}
  .row .it{font-weight:800;font-size:calc(15.5px * var(--fs));cursor:pointer;}
  .row .it:active{background:#eef2f8;border-radius:6px;}
  .row .it::after{content:"🔊";opacity:.28;font-size:11px;margin-left:6px;}
  .row .rom{color:var(--accent2);font-size:calc(13px * var(--fs));margin-top:1px;}
  .row .cn{color:var(--sub);font-size:calc(13.5px * var(--fs));margin-top:1px;cursor:pointer;}
  .row .cn:active{background:#fdf2f2;border-radius:6px;}
  .row .cn::after{content:"🀄";opacity:.28;font-size:11px;margin-left:6px;}
  .row .py{color:#94a3b8;font-size:calc(12px * var(--fs));margin-top:2px;letter-spacing:.3px;}
  .row.culture{display:block;}
  .row.culture .ct{font-size:calc(14px * var(--fs));color:var(--ink);}
  .row.culture .ct b{color:var(--accent);}
  .mark{border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:8px;padding:0 9px;height:34px;font-size:12px;cursor:pointer;flex:none;white-space:nowrap;}
  .mark.on{background:var(--ok);color:#fff;border-color:var(--ok);}
  .role{font-size:calc(11px * var(--fs));color:#fff;background:var(--accent);padding:1px 8px;border-radius:10px;display:inline-block;margin-bottom:3px;}

  .res-group{margin-top:14px;}
  .res-group h3{font-size:14px;margin:6px 2px;color:var(--accent);}

  .note{font-size:12px;color:var(--sub);margin:14px 2px;line-height:1.7;}
  .empty{text-align:center;color:var(--sub);padding:40px 10px;}

  .dash{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:10px;}
  .dcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);}
  .dcard .nm{font-weight:800;}
  .dcard .dbar{height:9px;background:var(--line);border-radius:6px;margin:8px 0 4px;overflow:hidden;}
  .dcard .dbar i{display:block;height:100%;background:var(--ok);}
  .dcard .dt{font-size:12px;color:var(--sub);}

  footer{text-align:center;color:var(--sub);font-size:12px;margin-top:26px;line-height:1.8;}
  .reset{background:none;border:1px solid var(--line);color:var(--sub);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:12px;}
  @media(max-width:560px){
    .brand h1{font-size:17px;}
    .row .main{min-width:140px;}
    .grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));}
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <span style="font-size:26px">🇮🇹💼</span>
      <div>
        <h1>意语职场通</h1>
        <div class="en">Italiano per il Lavoro · 意大利各行业华人实用意大利语</div>
      </div>
    </div>
    <div class="topbar">
      <div class="search">
        <input id="q" placeholder="搜索词汇 / 句型 / 对话…（中意均可）" onkeydown="if(event.key==='Enter')doSearch()">
        <button onclick="doSearch()">🔍</button>
      </div>
      <div class="progmini">
        <span id="pmTxt">0%</span>
        <span class="bar"><i id="pmBar"></i></span>
      </div>
      <div class="fsctl" title="调节学习内容字号">
        <span class="lbl">字号</span>
        <button class="fsbtn" onclick="fsStep(-1)" aria-label="缩小字号">A−</button>
        <span class="fsval" id="fsLbl">中</span>
        <button class="fsbtn" onclick="fsStep(1)" aria-label="放大字号">A+</button>
      </div>
    </div>
  </div>
</header>

<div class="wrap" id="app"><div class="empty">⏳ 加载中…</div></div>

<script>
/* ============ 数据：meta.js（极轻，秒开）+ data/<行业>.js（按需懒加载） ============ */
/* 注意：meta.js 用 defer 加载，会在 DOMContentLoaded 之前才执行；
   因此这里不能 const 捕获，必须在 boot() 里重新读取 window.META，否则会拿到空数组导致首页不渲染。 */
let META = window.META || [];
const DATA = window.DATA = window.DATA || {};

function loadInd(id, cb){
  if(DATA[id]) return cb(DATA[id]);
  const s=document.createElement('script');
  s.src='data/'+id+'.js';
  s.onload=function(){ cb(DATA[id]); };
  s.onerror=function(){
    document.getElementById('app').innerHTML='<div class="empty">⚠️ 该行业数据加载失败，请检查网络后重试。</div>';
  };
  document.head.appendChild(s);
}
function loadAll(cb){
  const pend=META.filter(m=>!DATA[m.id]);
  if(!pend.length) return cb();
  let n=pend.length;
  pend.forEach(function(m){ loadInd(m.id, function(){ if(--n===0) cb(); }); });
}

/* ============ 发音：优先真人 mp3，失败回退 Web Speech ============ */
let voices=[];
function loadVoices(){ try{voices=speechSynthesis.getVoices();}catch(e){} }
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=loadVoices; loadVoices(); }
function fallbackSpeak(text,lang){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=lang; u.rate=lang==='zh-CN'?1:0.9;
  const v=voices.find(x=>x.lang===lang)||voices.find(x=>x.lang&&x.lang.startsWith(lang.split('-')[0]));
  if(v)u.voice=v;
  speechSynthesis.speak(u);
}
let curAudio=null;   // 复用同一个 Audio 元素，避免重复创建与叠音
function speak(text,lang,audioPath){
  if(audioPath){
    if(!curAudio) curAudio=new Audio();
    curAudio.pause();
    try{ curAudio.currentTime=0; }catch(e){}
    curAudio.src=audioPath;
    let fell=false;
    const fb=function(){ if(!fell){ fell=true; fallbackSpeak(text,lang); } };
    curAudio.onerror=fb;
    const p=curAudio.play();
    if(p&&p.catch) p.catch(fb);
    return;
  }
  fallbackSpeak(text,lang);
}

/* ============ 进度存储 ============ */
const KEY='lavoro_it_progress_v3';
let prog={};
try{ prog=JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){ prog={}; }
function saveProg(){ try{ localStorage.setItem(KEY,JSON.stringify(prog)); }catch(e){} }
function isDone(id){ return !!prog[id]; }
function indTotal(m){ return m.vn+m.sn+m.dn; }
function indDone(m){ let n=0; for(const k in prog){ if(k.indexOf(m.id+'-')===0) n++; } return n; }
function metaOf(id){ return META.find(x=>x.id===id)||{id:id,vn:0,sn:0,dn:0,cn:0}; }
function totalCount(){ return META.reduce(function(a,m){ return a+indTotal(m); },0); }
function doneCount(){ return Object.keys(prog).length; }

/* ============ 字号调节（持久化到本机） ============ */
const FS_KEY='lavoro_it_fs';
const FS_LEVELS=[0.85,1.0,1.15,1.32];
const FS_LABELS=['小','中','大','特大'];
let fsIdx=1;
try{ const s=parseInt(localStorage.getItem(FS_KEY),10); if(!isNaN(s)&&s>=0&&s<FS_LEVELS.length) fsIdx=s; }catch(e){}
function updateFsLabel(){ const el=document.getElementById('fsLbl'); if(el) el.textContent=FS_LABELS[fsIdx]; }
function applyFs(){ document.documentElement.style.setProperty('--fs', FS_LEVELS[fsIdx]); updateFsLabel(); }
function fsStep(d){
  fsIdx=Math.max(0, Math.min(FS_LEVELS.length-1, fsIdx+d));
  try{ localStorage.setItem(FS_KEY, String(fsIdx)); }catch(e){}
  applyFs();
}

/* ============ 工具 ============ */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pct(a,b){ return b? Math.round(a/b*100):0; }

/* ============ 渲染 ============ */
const app=document.getElementById('app');
let view={type:'home', ind:null, tab:'vocab', q:''};

function renderHeader(){
  const t=doneCount(), tot=totalCount();
  document.getElementById('pmTxt').textContent=pct(t,tot)+'%';
  document.getElementById('pmBar').style.width=pct(t,tot)+'%';
}

/* vocab: [it, rom, cn, group, py] */
function vocabRow(I,i){
  const v=I.vocab[i]; const id=I.id+'-v-'+i; const on=isDone(id);
  const ait='audio/'+I.id+'/v_'+i+'_it.mp3', azh='audio/'+I.id+'/v_'+i+'_zh.mp3';
  return '<div class="row">'+
    '<div class="rowtop"><button class="mark '+(on?'on':'')+'" data-id="'+id+'">'+(on?'✓ 已掌握':'标记掌握')+'</button></div>'+
    '<div class="it" data-spk="'+esc(v[0])+'" data-lang="it-IT" data-audio="'+ait+'" title="点击听意大利语">'+esc(v[0])+'</div>'+
    '<div class="rom">'+esc(v[1]||'')+'</div>'+
    '<div class="cn" data-spk="'+esc(v[2])+'" data-lang="zh-CN" data-audio="'+azh+'" title="点击听中文">'+esc(v[2]||'')+'</div>'+
    '<div class="py">'+esc(v[4]||'')+'</div>'+
  '</div>';
}
function vocabList(I){
  let h='', last=null;
  I.vocab.forEach(function(v,i){
    const g=v[3]||'';
    if(g!==last){ if(g) h+='<div class="grp">'+esc(g)+'</div>'; last=g; }
    h+=vocabRow(I,i);
  });
  return h;
}
/* sentences: [it, rom, cn, group, py] */
function sentRow(I,i){
  const s=I.sentences[i]; const id=I.id+'-s-'+i; const on=isDone(id);
  const ait='audio/'+I.id+'/s_'+i+'_it.mp3', azh='audio/'+I.id+'/s_'+i+'_zh.mp3';
  return '<div class="row">'+
    '<div class="rowtop"><button class="mark '+(on?'on':'')+'" data-id="'+id+'">'+(on?'✓ 已掌握':'标记掌握')+'</button></div>'+
    '<div class="it" data-spk="'+esc(s[0])+'" data-lang="it-IT" data-audio="'+ait+'" title="点击听意大利语">'+esc(s[0])+'</div>'+
    '<div class="rom">'+esc(s[1]||'')+'</div>'+
    '<div class="cn" data-spk="'+esc(s[2])+'" data-lang="zh-CN" data-audio="'+azh+'" title="点击听中文">'+esc(s[2]||'')+'</div>'+
    '<div class="py">'+esc(s[4]||'')+'</div>'+
  '</div>';
}
function sentList(I){
  let h='', last=null;
  I.sentences.forEach(function(s,i){
    const g=s[3]||'';
    if(g!==last){ if(g) h+='<div class="grp">'+esc(g)+'</div>'; last=g; }
    h+=sentRow(I,i);
  });
  return h;
}
/* dialogue lines: [role, it, rom, cn, py] */
function dialogBlock(I){
  let h='';
  I.dialogues.forEach(function(d,di){
    h+='<div class="grp">💬 '+esc(d.scene)+'</div>';
    d.lines.forEach(function(ln,li){
      const id=I.id+'-d-'+di+'-'+li; const on=isDone(id);
      const ait='audio/'+I.id+'/d_'+di+'_'+li+'_it.mp3', azh='audio/'+I.id+'/d_'+di+'_'+li+'_zh.mp3';
      h+='<div class="row">'+
        '<div class="rowtop"><button class="mark '+(on?'on':'')+'" data-id="'+id+'">'+(on?'✓ 已掌握':'标记掌握')+'</button></div>'+
        '<span class="role">'+esc(ln[0])+'</span>'+
        '<div class="it" data-spk="'+esc(ln[1])+'" data-lang="it-IT" data-audio="'+ait+'" title="点击听意大利语">'+esc(ln[1])+'</div>'+
        '<div class="rom">'+esc(ln[2]||'')+'</div>'+
        '<div class="cn" data-spk="'+esc(ln[3])+'" data-lang="zh-CN" data-audio="'+azh+'" title="点击听中文">'+esc(ln[3]||'')+'</div>'+
        '<div class="py">'+esc(ln[4]||'')+'</div>'+
      '</div>';
    });
  });
  return h;
}
/* culture：纯文本，不加拼音 */
function cultureBlock(I){
  return I.culture.map(function(c){
    const txt=Array.isArray(c)?c[0]:c;
    return '<div class="row culture"><div class="ct">• '+esc(txt)+'</div></div>';
  }).join('');
}

function renderHome(){
  let cards=META.map(function(m){
    const d=indDone(m),t=indTotal(m);
    return '<div class="icard" onclick="openInd(\''+m.id+'\')" style="border-top:3px solid '+m.color+'">'+
      '<div class="ic">'+m.icon+'</div>'+
      '<div class="nm">'+esc(m.name)+'</div>'+
      '<div class="it">'+esc(m.it)+'</div>'+
      '<div class="meta">词汇 '+m.vn+' · 对话 '+m.ds+' · 句型 '+m.sn+'</div>'+
      '<div class="pbar"><i style="width:'+pct(d,t)+'%"></i></div>'+
      '<div class="meta">已学 '+d+'/'+t+'</div>'+
    '</div>';
  }).join('');
  app.innerHTML=
    '<div class="home-intro">'+
      '<b>意语职场通</b> 专为在意大利工作的华人打造，按行业分类，覆盖在意华人主要工作场景。'+
      '每一条都提供 <b>意大利语 + 中文谐音 + 中文意思（附拼音）</b>。<b>点击意大利语文本</b>听意语真人发音，<b>点击中文文本</b>（不含谐音）听中文真人发音；点「标记掌握」记录学习进度，进度自动保存在本机。'+
    '</div>'+
    '<div class="section-title">📚 选择行业开始学习</div>'+
    '<div class="grid">'+cards+'</div>'+
    '<div class="section-title">📊 我的学习总览</div>'+
    '<div class="dash" id="dash"></div>'+
    '<div class="note">'+
      '提示：①「中文谐音」为近似发音，仅供辅助，准确发音请以真人语音为准；②学习进度保存在当前浏览器本地，换设备不会同步。'+
    '</div>'+
    '<div style="text-align:center;margin-top:10px;">'+
      '<button class="reset" onclick="resetProg()">清空学习进度</button>'+
    '</div>'+
    '<footer>意语职场通 · Italiano per il Lavoro · 为意大利华人从业者而做 🇮🇹</footer>';
  renderDash();
}
function renderDash(){
  const el=document.getElementById('dash'); if(!el)return;
  el.innerHTML=META.map(function(m){
    const d=indDone(m),t=indTotal(m);
    return '<div class="dcard">'+
      '<div class="nm">'+m.icon+' '+esc(m.name)+'</div>'+
      '<div class="dbar"><i style="width:'+pct(d,t)+'%"></i></div>'+
      '<div class="dt">'+pct(d,t)+'% · 已学 '+d+'/'+t+'</div>'+
    '</div>';
  }).join('');
}

function openInd(id){
  view.type='ind'; view.ind=id; view.tab='vocab';
  const I=DATA[id];
  if(I) return render();
  app.innerHTML='<div class="empty">⏳ 正在载入「'+esc((metaOf(id).name||id))+'」…</div>';
  loadInd(id, function(){ render(); });
}
function renderInd(){
  const I=DATA[view.ind];
  if(!I){ app.innerHTML='<div class="empty">⚠️ 数据未加载，请返回重试。</div>'; return; }
  const m=metaOf(view.ind); const d=indDone(m),t=indTotal(m);
  const tabs=[['vocab','词汇'],['dialog','对话'],['sent','句型'],['culture','文化']];
  let body='';
  if(view.tab==='vocab') body=vocabList(I);
  else if(view.tab==='sent') body=sentList(I);
  else if(view.tab==='dialog') body=dialogBlock(I);
  else body=cultureBlock(I);
  app.innerHTML=
    '<div class="back" onclick="goHome()">← 返回行业列表</div>'+
    '<div class="ind-head">'+
      '<div class="ic">'+m.icon+'</div>'+
      '<div><h2>'+esc(m.name)+'</h2>'+
      '<div class="it">'+esc(m.it)+' · 已学 '+d+'/'+t+'（'+pct(d,t)+'%）</div></div>'+
    '</div>'+
    '<div class="tabs">'+
      tabs.map(function(x){ return '<button class="tab '+(view.tab===x[0]?'on':'')+'" onclick="setTab(\''+x[0]+'\')">'+x[1]+'</button>'; }).join('')+
    '</div>'+
    '<div class="block">'+(body||'<div class="empty">暂无内容</div>')+'</div>';
}
function setTab(t){ view.tab=t; renderInd(); }
function goHome(){ view.type='home'; render(); }

function doSearch(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  if(!q){ goHome(); return; }
  view.type='search'; view.q=q;
  app.innerHTML='<div class="empty">⏳ 正在检索全部行业…</div>';
  loadAll(function(){ renderSearch(); });
}
function renderSearch(){
  const q=view.q;
  let groups=[];
  META.forEach(function(m){
    const I=DATA[m.id]; if(!I) return;
    let vh='';
    I.vocab.forEach(function(v,i){
      if((v[0]+' '+(v[1]||'')+' '+(v[2]||'')).toLowerCase().indexOf(q)>=0) vh+=vocabRow(I,i);
    });
    let sh='';
    I.sentences.forEach(function(s,i){
      if((s[0]+' '+(s[1]||'')+' '+(s[2]||'')).toLowerCase().indexOf(q)>=0) sh+=sentRow(I,i);
    });
    let dh='';
    I.dialogues.forEach(function(d,di){
      d.lines.forEach(function(ln,li){
        if((ln[0]+' '+ln[1]+' '+(ln[3]||'')).toLowerCase().indexOf(q)>=0 || d.scene.toLowerCase().indexOf(q)>=0){
          dh+=dlgRow(I,di,li,ln);
        }
      });
    });
    let ch='';
    I.culture.forEach(function(c){
      const txt=Array.isArray(c)?c[0]:c;
      if(String(txt).toLowerCase().indexOf(q)>=0) ch+='<div class="row culture"><div class="ct">• '+esc(txt)+'</div></div>';
    });
    const total=vh+sh+dh+ch;
    if(total) groups.push('<div class="res-group"><h3>'+m.icon+' '+esc(m.name)+' · '+esc(m.it)+'</h3><div class="block">'+total+'</div></div>');
  });
  app.innerHTML=
    '<div class="back" onclick="goHome()">← 返回行业列表</div>'+
    '<div class="section-title">🔍 搜索「'+esc(view.q)+'」的结果</div>'+
    (groups.join('')||'<div class="empty">没有找到相关内容，换个词试试。</div>');
}
function dlgRow(I,di,li,ln){
  const id=I.id+'-d-'+di+'-'+li; const on=isDone(id);
  const ait='audio/'+I.id+'/d_'+di+'_'+li+'_it.mp3', azh='audio/'+I.id+'/d_'+di+'_'+li+'_zh.mp3';
  return '<div class="row">'+
    '<div class="rowtop"><button class="mark '+(on?'on':'')+'" data-id="'+id+'">'+(on?'✓ 已掌握':'标记掌握')+'</button></div>'+
    '<span class="role">'+esc(ln[0])+'</span>'+
    '<div class="it" data-spk="'+esc(ln[1])+'" data-lang="it-IT" data-audio="'+ait+'" title="点击听意大利语">'+esc(ln[1])+'</div>'+
    '<div class="rom">'+esc(ln[2]||'')+'</div>'+
    '<div class="cn" data-spk="'+esc(ln[3])+'" data-lang="zh-CN" data-audio="'+azh+'" title="点击听中文">'+esc(ln[3]||'')+'</div>'+
    '<div class="py">'+esc(ln[4]||'')+'</div>'+
  '</div>';
}

function resetProg(){
  if(confirm('确定清空全部学习进度吗？此操作不可恢复。')){
    prog={}; saveProg(); render(); renderHeader();
  }
}

/* ============ 事件委托 ============ */
document.addEventListener('click',function(e){
  const au=e.target.closest('[data-spk]');
  if(au){ speak(au.dataset.spk, au.dataset.lang, au.dataset.audio); return; }
  const mk=e.target.closest('.mark');
  if(mk){
    const id=mk.dataset.id;
    if(isDone(id)) delete prog[id]; else prog[id]=1;
    saveProg(); renderHeader();
    const on=isDone(id);
    mk.classList.toggle('on',on);
    mk.textContent=on?'✓ 已掌握':'标记掌握';
    if(view.type==='home') renderDash();
    if(view.type==='ind'){
      const m=metaOf(view.ind);
      const el=document.querySelector('.ind-head .it');
      if(el) el.textContent=m.it+' · 已学 '+indDone(m)+'/'+indTotal(m)+'（'+pct(indDone(m),indTotal(m))+'%）';
    }
    return;
  }
});

function render(){ renderHeader(); if(view.type==='home')renderHome(); else if(view.type==='ind')renderInd(); else renderSearch(); }
function boot(){
  applyFs();   // 应用上次保存的字号
  META = window.META || META;   // 重新读取（defer 的 meta.js 此时已执行）
  if(META.length) render();
  else document.getElementById('app').innerHTML='<div class="empty">⚠️ 数据加载失败，请刷新页面（或检查网络）。</div>';
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

/* ============ 悬停预取音频（点击前先暖缓存） ============ */
document.addEventListener('pointerover',function(e){
  const el=e.target.closest('[data-audio]');
  if(!el || el.dataset.pf) return;
  const src=el.dataset.audio; if(!src) return;
  el.dataset.pf='1';
  const link=document.createElement('link');
  link.rel='prefetch'; link.as='audio'; link.href=src;
  document.head.appendChild(link);
}, {passive:true});

/* ============ Service Worker：仅缓存 mp3，二次播放秒开 + 离线可用 ============ */
(function(){
  if(!('serviceWorker' in navigator)) return;
  const ok = location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1';
  if(!ok) return;
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
})();
</script>
</body>
